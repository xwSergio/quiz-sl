<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Placas Solares S.L.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0f1c2e; --panel: #182a42; --line: #2a4060; --fg: #f3f6fb; --muted: #9fb2cc; --sun: #ffb627;
  --a1: #e5484d; --a2: #2f6fe4; --a3: #e0a100; --a4: #1f9d55; --ok: #2fbf71; --bad: #e5484d;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.app { max-width: 960px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; }
.sun { width: 26px; height: 26px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 4px rgba(255,182,39,.18), 0 0 0 9px rgba(255,182,39,.08); }
.stats { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
.chip span { color: var(--muted); font-weight: 600; margin-right: 4px; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.intro { flex: 1; display: grid; place-content: center; text-align: center; gap: 20px; padding-block: 24px; }
.intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 6vw, 56px); line-height: 1.02; margin: 0; text-wrap: balance; }
.intro h1 em { font-style: normal; color: var(--sun); }
.intro p { color: var(--muted); max-width: 52ch; margin: 0 auto; line-height: 1.5; }
.facts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn { font: 700 18px var(--display); color: #1a1200; background: var(--sun); border: 0; border-radius: 12px; padding: 14px 28px; cursor: pointer; box-shadow: 0 5px 0 #b57b00; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b57b00; }
.btn:focus-visible, .ans:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.btn.ghost { background: var(--panel); color: var(--fg); box-shadow: 0 5px 0 #0a1422; border: 1px solid var(--line); }
.qhead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.question { background: var(--fg); color: #0f1c2e; border-radius: 14px; padding: 22px 20px; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3.2vw, 30px); line-height: 1.2; text-wrap: balance; }
.mid { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.timer { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font: 800 28px var(--display); font-variant-numeric: tabular-nums; background: conic-gradient(var(--sun) calc(var(--p, 1) * 360deg), var(--line) 0); position: relative; }
.timer::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); }
.timer b { position: relative; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .4s; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { --c: var(--a1); display: flex; align-items: center; gap: 14px; text-align: left; min-height: 92px; padding: 16px 18px; border-radius: 12px; border: 0; background: var(--c); color: #fff; cursor: pointer; font: 700 clamp(15px, 2.1vw, 19px)/1.25 var(--body); box-shadow: 0 5px 0 rgba(0,0,0,.35); transition: transform .08s, opacity .25s, filter .25s; }
.ans:hover:not(:disabled) { filter: brightness(1.08); }
.ans:active:not(:disabled) { transform: translateY(3px); }
.ans:disabled { cursor: default; }
.ans .shape { flex: none; width: 34px; height: 34px; display: grid; place-items: center; }
.ans .shape svg { width: 30px; height: 30px; fill: #fff; }
.ans .key { margin-left: auto; flex: none; font-size: 12px; opacity: .75; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; padding: 2px 7px; }
.ans:nth-child(2) { --c: var(--a2); } .ans:nth-child(3) { --c: var(--a3); } .ans:nth-child(4) { --c: var(--a4); }
.ans.dim { opacity: .28; }
.ans.right { outline: 4px solid #fff; outline-offset: -4px; }
.ans .mark { margin-left: auto; font-size: 22px; flex: none; }
.feedback { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.feedback.ok { border-color: var(--ok); } .feedback.bad { border-color: var(--bad); }
.verdict { font: 800 22px var(--display); }
.feedback.ok .verdict { color: var(--ok); } .feedback.bad .verdict { color: var(--bad); }
.feedback p { margin: 4px 0 0; color: var(--muted); line-height: 1.45; font-size: 15px; }
.gain { font: 800 22px var(--display); color: var(--sun); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fbtxt { min-width: 0; }
.next-row { display: flex; justify-content: flex-end; }
.end { flex: 1; display: grid; gap: 20px; align-content: start; padding-block: 12px; }
.podium { text-align: center; display: grid; gap: 8px; }
.podium .big { font: 800 clamp(48px, 10vw, 88px)/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; }
.podium h2 { font: 800 28px var(--display); margin: 0; text-wrap: balance; }
.podium p { color: var(--muted); margin: 0; }
.review { display: grid; gap: 8px; }
.review h3 { margin: 0 0 4px; font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ritem { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ritem .n { font: 800 16px var(--display); color: var(--muted); }
.ritem .t { min-width: 0; } .ritem .t b { display: block; font-weight: 600; } .ritem .t small { color: var(--muted); }
.ritem .s { font-weight: 800; font-size: 18px; } .ritem .s.ok { color: var(--ok); } .ritem .s.bad { color: var(--bad); }
.end .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.namebox { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.namebox input { font: 700 18px var(--body); color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; width: min(320px, 100%); }
.namebox input:focus-visible { outline: none; border-color: var(--sun); }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--bad); font-weight: 700; font-size: 14px; min-height: 1.2em; margin: 0; }
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.board-head h3 { margin: 0; font: 800 20px var(--display); }
.board-wrap { overflow-x: auto; }
table.rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.rank th { text-align: left; font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 16px; }
table.rank td { padding: 12px 16px; border-top: 1px solid var(--line); font-weight: 600; }
table.rank td.num, table.rank th.num { text-align: right; }
table.rank td.pos { width: 56px; font: 800 18px var(--display); color: var(--muted); }
table.rank tr.p1 td.pos { color: var(--sun); } table.rank tr.p2 td.pos { color: #c9d4e3; } table.rank tr.p3 td.pos { color: #d08a4e; }
table.rank tr.me td { background: rgba(255,182,39,.12); }
table.rank td.pts { font: 800 18px var(--display); }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }
.linkbtn { background: none; border: 0; color: var(--muted); font: 600 13px var(--body); text-decoration: underline; cursor: pointer; padding: 4px; }
.rankline { font: 800 18px var(--display); color: var(--sun); }
td.prog { color: var(--muted); font-size: 14px; white-space: nowrap; }
body.tv .app { max-width: 1200px; }
body.tv .stats { display: none; }
body.tv table.rank td { font-size: 22px; padding: 14px 18px; }
body.tv .board-head h3 { font-size: 30px; }
.whoami { color: var(--muted); font-size: 14px; font-weight: 600; }
@media (max-width: 560px) {
  .answers { grid-template-columns: 1fr; gap: 10px; } .ans { min-height: 64px; } .ans .key { display: none; }
  .feedback { grid-template-columns: 1fr; } .timer { width: 60px; height: 60px; font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }
.pop { animation: pop .25s ease-out; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="sun" aria-hidden="true"></div>Placas Solares S.L.</div>
    <div class="stats" aria-live="polite">
      <div class="chip" id="whochip" hidden><span>Jugador</span><b id="who"></b></div>
      <div class="chip"><span>Puntos</span><b id="score">0</b></div>
      <div class="chip"><span>Racha</span><b id="streak">0</b></div>
    </div>
  </header>
  <main id="screen" class="screen"></main>
</div>
<script>
const SHAPES = [
  '<svg viewBox="0 0 24 24"><path d="M12 3 22 20H2z"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></svg>',
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>'
];
const TIME = 25;
const QUESTIONS = [
  { q: "¿Cuántas personas quieren crear la empresa de instalación de placas solares?", a: ["Cuatro", "Cinco", "Seis", "Ocho"], c: 2, why: "Son seis socios y quieren ser los únicos propietarios de la empresa." },
  { q: "¿De qué presupuesto total disponen los socios?", a: ["6.000 euros", "3.000 euros", "60.000 euros", "1.000 euros"], c: 0, why: "Entre todos cuentan con 6.000 euros para aportar al negocio." },
  { q: "¿Cuál es el capital mínimo legal de una sociedad limitada según el audio?", a: ["3.000 euros", "6.000 euros", "1 euro", "60.000 euros"], c: 2, why: "El capital mínimo legal de una SL es de 1 euro, así que los 6.000 € son suficientes." },
  { q: "Si los seis socios aportan lo mismo, ¿cuánto pone cada uno?", a: ["500 € y una décima parte", "2.000 € y un tercio", "6.000 € cada uno", "1.000 € y una sexta parte"], c: 3, why: "6.000 € entre 6 son 1.000 € por socio, y cada uno tendría una sexta parte de las participaciones." },
  { q: "¿Qué quiere hacer el socio que se va a vivir a Estados Unidos?", a: ["Trabajar a distancia", "Vender su parte", "Abrir una sede allí", "Duplicar su aportación"], c: 1, why: "Uno de los socios se irá a Estados Unidos y quiere vender sus participaciones." },
  { q: "¿Qué se puede incluir en los estatutos para resolver la venta de esas participaciones?", a: ["Un derecho de adquisición preferente", "Un aval personal", "Una ampliación de capital", "Un contrato indefinido"], c: 0, why: "Con el derecho de adquisición preferente, los demás socios tienen preferencia para comprar su parte." },
  { q: "En una SL, ¿en qué caso los socios SÍ pueden responder con sus bienes personales?", a: ["Siempre que haya deudas", "Cuando la empresa tiene pérdidas un año", "Cuando firman avales personales", "Nunca, en ningún caso"], c: 2, why: "Como regla general la responsabilidad se limita al capital aportado, pero hay excepciones, como los avales personales." },
  { q: "¿Qué permite constituir la sociedad limitada de forma telemática?", a: ["El Registro Civil y el NIE", "El sistema CIRCE y el DUE", "La Seguridad Social y el IAE", "Un correo al notario"], c: 1, why: "La SL se puede tramitar mediante CIRCE y el Documento Único Electrónico (DUE), con intervención del notario." },
  { q: "¿Qué requisito tiene la sociedad limitada laboral (SLL)?", a: ["Tener un único socio", "Un capital mínimo de 60.000 €", "Que se constituya solo en papel", "Que la mayoría del capital sea de socios trabajadores con contrato indefinido"], c: 3, why: "En la SLL la mayoría del capital debe pertenecer a socios que trabajen en la empresa con contrato indefinido." },
  { q: "¿Qué forma jurídica eligen finalmente para el proyecto?", a: ["Sociedad limitada laboral", "Sociedad anónima", "Sociedad limitada (SL)", "Empresario individual"], c: 2, why: "Eligen la SL porque cumple las cinco condiciones y ofrece una estructura flexible." }
];

const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("es-ES");
const screen = $("#screen");
let state;
let playerName = "";

/* ---------- Clasificación compartida (Google Sheets) ---------- */
// Pega aquí la URL de la aplicación web de Apps Script (termina en /exec)
const API = "";
const live = { rows: [], status: API ? "loading" : "off" };
const boardViews = new Set();

let myId = "";
try { myId = localStorage.getItem("quiz-sl-id") || ""; } catch (e) {}
if (!myId) { myId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try { localStorage.setItem("quiz-sl-id", myId); } catch (e) {} }

function bestByName(list) {
  return list.filter(r => String(r.name || "").trim())
    .map(r => ({ id: String(r.id || r.name), name: String(r.name).trim(), score: Number(r.score) || 0, hits: Number(r.hits) || 0, q: Number(r.q) || 0 }))
    .sort((x, y) => y.score - x.score || y.hits - x.hits || x.name.localeCompare(y.name));
}
function myRank() {
  const i = live.rows.findIndex(r => r.id === myId);
  return i < 0 ? null : { pos: i + 1, total: live.rows.length };
}
function sendProgress(final) {
  if (!state) return Promise.resolve("off");
  return saveScore({ id: myId, name: playerName, score: state.score, hits: state.log.filter(l => l.ok).length, q: state.log.length, final: !!final });
}
async function refresh() {
  if (!API) { renderBoards(); return; }
  try {
    const r = await fetch(API + (API.includes("?") ? "&" : "?") + "t=" + Date.now());
    const data = await r.json();
    live.rows = bestByName(Array.isArray(data) ? data : (data.rows || []));
    live.status = "ok";
  } catch (e) { if (live.status !== "ok") live.status = "error"; }
  renderBoards();
}
refresh();
setInterval(() => { if (boardViews.size && !document.hidden) refresh(); }, 5000);

async function saveScore(rec) {
  if (!API) return "off";
  const i = live.rows.findIndex(r => r.id === rec.id);
  if (i >= 0) { const prev = live.rows[i]; if (!(prev.q >= 10 && prev.score > rec.score)) Object.assign(prev, { name: rec.name, score: rec.score, hits: rec.hits, q: rec.q }); }
  else live.rows.push({ id: rec.id, name: rec.name, score: rec.score, hits: rec.hits, q: rec.q });
  live.rows = bestByName(live.rows); renderBoards();
  try {
    // text/plain evita la comprobación CORS previa de Google
    await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) });
    await refresh();
    return "saved";
  } catch (e) {
    try { await fetch(API, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(rec) }); setTimeout(refresh, 1500); return "saved"; }
    catch (e2) { return "error"; }
  }
}
function boardHTML() {
  let body;
  if (live.status === "off") body = `<div class="empty">La tabla compartida todavía no está configurada.</div>`;
  else if (live.status === "loading") body = `<div class="empty">Cargando clasificación…</div>`;
  else if (live.status === "error") body = `<div class="empty">No se pudo cargar la tabla. Revisa la conexión y recarga.</div>`;
  else if (!live.rows.length) body = `<div class="empty">Todavía no hay puntuaciones. Aparecerán aquí en cuanto alguien termine el quiz.</div>`;
  else body = `<div class="board-wrap"><table class="rank">
      <thead><tr><th>#</th><th>Nombre</th><th class="num">Progreso</th><th class="num">Aciertos</th><th class="num">Puntos</th></tr></thead>
      <tbody>${live.rows.map((r, i) => `<tr class="${i < 3 ? "p" + (i + 1) : ""} ${r.id === myId && playerName ? "me" : ""}">
        <td class="pos">${i + 1}</td><td>${esc(r.name)}${r.id === myId && playerName ? " (tú)" : ""}</td>
        <td class="num prog">${r.q >= 10 ? "Terminado" : r.q + "/10"}</td>
        <td class="num">${r.hits}</td><td class="num pts">${fmt(r.score)}</td></tr>`).join("")}</tbody></table></div>`;
  const playing = live.rows.filter(r => r.q < 10).length;
  const note = live.status === "ok" ? `${live.rows.length} jugador${live.rows.length === 1 ? "" : "es"}${playing ? " · " + playing + " jugando ahora" : ""} · en directo` : "";
  return `<div class="board"><div class="board-head"><h3>Tabla de puntos</h3><span class="hint">${note}</span></div>${body}</div>`;
}
function renderBoards() {
  boardViews.forEach(el => { if (!el.isConnected) { boardViews.delete(el); return; } el.innerHTML = boardHTML(); });
}
function mountBoard(el) { boardViews.add(el); el.innerHTML = boardHTML(); refresh(); }

/* ---------- Juego ---------- */
function reset() {
  state = { i: 0, score: 0, streak: 0, best: 0, log: [], timer: null, locked: false };
  $("#score").textContent = 0; $("#streak").textContent = 0;
}
function intro() {
  reset();
  $("#whochip").hidden = true;
  screen.innerHTML = `
    <section class="intro pop">
      <h1>¿Qué sociedad para <em>seis socios</em> y 6.000 €?</h1>
      <p>Diez preguntas sobre el audio: seis personas crean una empresa de instalación de placas solares y comparan la sociedad limitada con la sociedad limitada laboral.</p>
      <div class="facts">
        <div class="chip"><span>Preguntas</span>10</div>
        <div class="chip"><span>Tiempo</span>${TIME} s</div>
        <div class="chip"><span>Máx.</span>1.000 pts + racha</div>
      </div>
      <form class="namebox" id="nameForm" novalidate>
        <label for="nameInput" style="position:absolute;left:-9999px">Tu nombre</label>
        <input id="nameInput" maxlength="24" autocomplete="off" placeholder="Escribe tu nombre" value="${esc(playerName)}">
        <button class="btn" type="submit">Empezar</button>
      </form>
      <p class="err" id="nameErr" role="alert"></p>
      <p class="hint">Responde tocando una ficha o con las teclas 1–4. Cuanto antes aciertes, más puntos.</p>
      <div><button class="linkbtn" id="seeBoard" type="button">Ver la tabla de puntos</button></div>
    </section>`;
  const inp = $("#nameInput");
  $("#nameForm").onsubmit = e => {
    e.preventDefault();
    const n = inp.value.trim().replace(/\s+/g, " ");
    if (n.length < 2) { $("#nameErr").textContent = "Escribe tu nombre (al menos 2 letras) para entrar."; inp.focus(); return; }
    playerName = n;
    $("#who").textContent = n; $("#whochip").hidden = false;
    reset();
    sendProgress(false);
    ask();
  };
  $("#seeBoard").onclick = showBoard;
}
function showBoard() {
  $("#whochip").hidden = true;
  screen.innerHTML = `<section class="end pop"><div id="boardSlot"></div>
    <div class="actions"><button class="btn ghost" id="back">Volver al inicio</button></div></section>`;
  mountBoard($("#boardSlot"));
  $("#back").onclick = intro;
}
function ask() {
  const Q = QUESTIONS[state.i];
  state.locked = false; state.t0 = performance.now();
  screen.innerHTML = `
    <div class="qhead"><span>Pregunta ${state.i + 1} de ${QUESTIONS.length}</span><span>${esc(playerName)}</span></div>
    <div class="question pop">${Q.q}</div>
    <div class="mid">
      <div class="timer" id="timer" style="--p:1"><b id="tnum">${TIME}</b></div>
      <div class="bar" aria-hidden="true"><i style="width:${(state.i / QUESTIONS.length) * 100}%"></i></div>
    </div>
    <div class="answers" id="answers">
      ${Q.a.map((t, k) => `<button class="ans" data-k="${k}"><span class="shape" aria-hidden="true">${SHAPES[k]}</span><span>${t}</span><span class="key" aria-hidden="true">${k + 1}</span></button>`).join("")}
    </div>
    <div id="fb"></div>`;
  screen.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.k));
  clearInterval(state.timer);
  state.timer = setInterval(tick, 100);
}
function tick() {
  const left = Math.max(0, TIME - (performance.now() - state.t0) / 1000);
  const t = $("#timer"); if (!t) return;
  t.style.setProperty("--p", left / TIME);
  $("#tnum").textContent = Math.ceil(left);
  if (left <= 0) answer(-1);
}
function answer(k) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.timer);
  const Q = QUESTIONS[state.i];
  const elapsed = Math.min(TIME, (performance.now() - state.t0) / 1000);
  const ok = k === Q.c;
  let gain = 0;
  if (ok) {
    state.streak++;
    gain = Math.round(1000 * (1 - (elapsed / TIME) / 2));
    if (state.streak >= 2) gain += Math.min(500, (state.streak - 1) * 100);
    state.score += gain;
  } else state.streak = 0;
  state.best = Math.max(state.best, state.streak);
  state.log.push({ k, ok, gain });
  $("#score").textContent = fmt(state.score);
  $("#streak").textContent = state.streak;
  screen.querySelectorAll(".ans").forEach((b, idx) => {
    b.disabled = true;
    if (idx === Q.c) { b.classList.add("right"); b.querySelector(".key")?.remove(); b.insertAdjacentHTML("beforeend", '<span class="mark" aria-label="correcta">✓</span>'); }
    else b.classList.add("dim");
    if (idx === k && !ok) { b.classList.remove("dim"); b.style.opacity = .6; b.querySelector(".key")?.remove(); b.insertAdjacentHTML("beforeend", '<span class="mark" aria-label="tu respuesta">✗</span>'); }
  });
  const last = state.i === QUESTIONS.length - 1;
  sendProgress(last).then(() => { const rk = myRank(), el = $("#rankLine"); if (rk && el) el.textContent = `Vas ${rk.pos}º de ${rk.total}`; });
  const verdict = ok ? (state.streak >= 3 ? `¡Correcto! Racha de ${state.streak}` : "¡Correcto!") : (k === -1 ? "Se acabó el tiempo" : "Incorrecto");
  $("#fb").innerHTML = `
    <div class="feedback ${ok ? "ok" : "bad"} pop" role="status">
      <div class="verdict">${ok ? "✓" : "✗"}</div>
      <div class="fbtxt"><div class="verdict">${verdict}</div><p>${Q.why}</p></div>
      <div class="gain">+${gain}</div>
    </div>
    <div class="next-row" style="margin-top:12px;justify-content:space-between;align-items:center"><span class="rankline" id="rankLine">${API ? "Calculando tu puesto…" : ""}</span><button class="btn" id="next">${last ? "Ver resultados" : "Siguiente"}</button></div>`;
  const n = $("#next");
  n.onclick = () => { state.i++; last ? finish() : ask(); };
  n.focus();
}
async function finish() {
  const hits = state.log.filter(l => l.ok).length;
  const msg = hits === 10 ? "Pleno. Listos para ir al notario."
    : hits >= 8 ? "Muy bien. Dominas la sociedad limitada."
    : hits >= 5 ? "Bien. Repasa los detalles que fallaste."
    : "Vuelve a escuchar el audio y repite.";
  screen.innerHTML = `
    <section class="end pop">
      <div class="podium">
        <div class="whoami">${esc(playerName)}</div>
        <div class="big">${fmt(state.score)}</div>
        <h2>${hits} de ${QUESTIONS.length} aciertos</h2>
        <p>${msg} Mejor racha: ${state.best}.</p>
        <p class="hint" id="saveMsg">Guardando tu puntuación en la tabla…</p>
      </div>
      <div id="boardSlot"></div>
      <div class="actions"><button class="btn" id="again">Jugar otra vez</button></div>
      <div class="review">
        <h3>Repaso</h3>
        ${QUESTIONS.map((Q, i) => {
          const l = state.log[i];
          return `<div class="ritem"><div class="n">${i + 1}</div><div class="t"><b>${Q.q}</b><small>Respuesta: ${Q.a[Q.c]}${!l.ok ? (l.k === -1 ? " · sin responder" : " · tú: " + Q.a[l.k]) : ""}</small></div><div class="s ${l.ok ? "ok" : "bad"}">${l.ok ? "+" + l.gain : "✗"}</div></div>`;
        }).join("")}
      </div>
    </section>`;
  $("#again").onclick = intro;
  mountBoard($("#boardSlot"));
  const res = await sendProgress(true);
  const rk = myRank();
  const m = $("#saveMsg"); if (!m) return;
  m.textContent = { saved: rk ? `Has quedado ${rk.pos}º de ${rk.total}. La tabla se sigue actualizando mientras juegan los demás.` : "Puntuación guardada en la tabla de todos.", off: "La tabla compartida todavía no está configurada.", error: "No se pudo guardar. Revisa la conexión." }[res];
}
document.addEventListener("keydown", e => {
  if (!state || state.locked || !$("#answers") || e.target.tagName === "INPUT") return;
  const k = ["1","2","3","4"].indexOf(e.key);
  if (k >= 0) answer(k);
});
if (/[?&]tabla\b/.test(location.search)) {
  document.body.classList.add("tv");
  screen.innerHTML = `<section class="end pop"><div class="podium"><h2>Clasificación en directo</h2><p>Escanea el QR del vídeo y escribe tu nombre para entrar en la partida.</p></div><div id="boardSlot"></div></section>`;
  mountBoard($("#boardSlot"));
} else intro();
</script>
</body>
</html>
