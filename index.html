<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz Placas Solares S.L.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #0f1c2e; --panel: #182a42; --line: #2a4060; --fg: #f3f6fb; --muted: #9fb2cc; --sun: #ffb627;
  --a1: #e5484d; --a2: #2f6fe4; --a3: #e0a100; --a4: #1f9d55; --ok: #2fbf71; --bad: #e5484d;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.app { max-width: 960px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 18px; }
.sun { width: 26px; height: 26px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 4px rgba(255,182,39,.18), 0 0 0 9px rgba(255,182,39,.08); }
.stats { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
.chip span { color: var(--muted); font-weight: 600; margin-right: 4px; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 16px; }
.intro { flex: 1; display: grid; place-content: center; text-align: center; gap: 20px; padding-block: 24px; }
.intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(32px, 6vw, 56px); line-height: 1.02; margin: 0; text-wrap: balance; }
.intro h1 em { font-style: normal; color: var(--sun); }
.intro p { color: var(--muted); max-width: 52ch; margin: 0 auto; line-height: 1.5; }
.facts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn { font: 700 18px var(--display); color: #1a1200; background: var(--sun); border: 0; border-radius: 12px; padding: 14px 28px; cursor: pointer; box-shadow: 0 5px 0 #b57b00; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b57b00; }
.btn:focus-visible, .ans:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.btn.ghost { background: var(--panel); color: var(--fg); box-shadow: 0 5px 0 #0a1422; border: 1px solid var(--line); }
.qhead { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.question { background: var(--fg); color: #0f1c2e; border-radius: 14px; padding: 22px 20px; text-align: center; font-family: var(--display); font-weight: 700; font-size: clamp(20px, 3.2vw, 30px); line-height: 1.2; text-wrap: balance; }
.mid { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; }
.timer { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font: 800 28px var(--display); font-variant-numeric: tabular-nums; background: conic-gradient(var(--sun) calc(var(--p, 1) * 360deg), var(--line) 0); position: relative; }
.timer::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); }
.timer b { position: relative; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .4s; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { --c: var(--a1); display: flex; align-items: center; gap: 14px; text-align: left; min-height: 92px; padding: 16px 18px; border-radius: 12px; border: 0; background: var(--c); color: #fff; cursor: pointer; font: 700 clamp(15px, 2.1vw, 19px)/1.25 var(--body); box-shadow: 0 5px 0 rgba(0,0,0,.35); transition: transform .08s, opacity .25s, filter .25s; }
.ans:hover:not(:disabled) { filter: brightness(1.08); }
.ans:active:not(:disabled) { transform: translateY(3px); }
.ans:disabled { cursor: default; }
.ans .shape { flex: none; width: 34px; height: 34px; display: grid; place-items: center; }
.ans .shape svg { width: 30px; height: 30px; fill: #fff; }
.ans .key { margin-left: auto; flex: none; font-size: 12px; opacity: .75; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; padding: 2px 7px; }
.ans:nth-child(2) { --c: var(--a2); } .ans:nth-child(3) { --c: var(--a3); } .ans:nth-child(4) { --c: var(--a4); }
.ans.dim { opacity: .28; }
.ans.right { outline: 4px solid #fff; outline-offset: -4px; }
.ans .mark { margin-left: auto; font-size: 22px; flex: none; }
.feedback { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.feedback.ok { border-color: var(--ok); } .feedback.bad { border-color: var(--bad); }
.verdict { font: 800 22px var(--display); }
.feedback.ok .verdict { color: var(--ok); } .feedback.bad .verdict { color: var(--bad); }
.feedback p { margin: 4px 0 0; color: var(--muted); line-height: 1.45; font-size: 15px; }
.gain { font: 800 22px var(--display); color: var(--sun); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fbtxt { min-width: 0; }
.next-row { display: flex; justify-content: flex-end; }
.end { flex: 1; display: grid; gap: 20px; align-content: start; padding-block: 12px; }
.podium { text-align: center; display: grid; gap: 8px; }
.podium .big { font: 800 clamp(48px, 10vw, 88px)/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; }
.podium h2 { font: 800 28px var(--display); margin: 0; text-wrap: balance; }
.podium p { color: var(--muted); margin: 0; }
.review { display: grid; gap: 8px; }
.review h3 { margin: 0 0 4px; font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ritem { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.ritem .n { font: 800 16px var(--display); color: var(--muted); }
.ritem .t { min-width: 0; } .ritem .t b { display: block; font-weight: 600; } .ritem .t small { color: var(--muted); }
.ritem .s { font-weight: 800; font-size: 18px; } .ritem .s.ok { color: var(--ok); } .ritem .s.bad { color: var(--bad); }
.end .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.namebox { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.namebox input { font: 700 18px var(--body); color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; width: min(320px, 100%); }
.namebox input:focus-visible { outline: none; border-color: var(--sun); }
.hint { font-size: 13px; color: var(--muted); }
.err { color: var(--bad); font-weight: 700; font-size: 14px; min-height: 1.2em; margin: 0; }
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.board-head h3 { margin: 0; font: 800 20px var(--display); }
.board-wrap { overflow-x: auto; }
table.rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.rank th { text-align: left; font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 16px; }
table.rank td { padding: 12px 16px; border-top: 1px solid var(--line); font-weight: 600; }
table.rank td.num, table.rank th.num { text-align: right; }
table.rank td.pos { width: 56px; font: 800 18px var(--display); color: var(--muted); }
table.rank tr.p1 td.pos { color: var(--sun); } table.rank tr.p2 td.pos { color: #c9d4e3; } table.rank tr.p3 td.pos { color: #d08a4e; }
table.rank tr.me td { background: rgba(255,182,39,.12); }
table.rank td.pts { font: 800 18px var(--display); }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }
.linkbtn { background: none; border: 0; color: var(--muted); font: 600 13px var(--body); text-decoration: underline; cursor: pointer; padding: 4px; }
.rankline { font: 800 18px var(--display); color: var(--sun); }
td.prog { color: var(--muted); font-size: 14px; white-space: nowrap; }
body.tv .app { max-width: 1200px; }
body.tv .stats { display: none; }
body.tv table.rank td { font-size: 22px; padding: 14px 18px; }
body.tv .board-head h3 { font-size: 30px; }
.whoami { color: var(--muted); font-size: 14px; font-weight: 600; }
@media (max-width: 560px) {
  .answers { grid-template-columns: 1fr; gap: 10px; } .ans { min-height: 64px; } .ans .key { display: none; }
  .feedback { grid-template-columns: 1fr; } .timer { width: 60px; height: 60px; font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }
.pop { animation: pop .25s ease-out; }
.status-line { font: 700 18px var(--display); color: var(--sun); margin: 0; }
.center { text-align: center; }
h2.center { font: 800 28px var(--display); margin: 0; }
.lobby { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 16px; padding-block: 24px; }
.lobby h1 { font: 800 clamp(28px, 5vw, 44px)/1.05 var(--display); margin: 0; text-wrap: balance; }
.pulse { width: 64px; height: 64px; border-radius: 50%; background: var(--sun); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(.85); box-shadow: 0 0 0 0 rgba(255,182,39,.45); } 50% { transform: scale(1); box-shadow: 0 0 0 22px rgba(255,182,39,0); } }
.names { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
.name-chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
.name-chip.mine { background: var(--sun); color: #1a1200; border-color: var(--sun); }
.names.big .name-chip { font-size: 20px; padding: 10px 18px; }
.go { color: var(--sun); font-size: clamp(48px, 10vw, 96px) !important; animation: pop .4s ease-out; }
.host-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.host-head h1 { margin: 0; font: 800 clamp(28px, 4vw, 40px) var(--display); }
.host-lobby { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: start; }
.join-card { background: #fff; color: #0f1c2e; border-radius: 16px; padding: 16px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.join-card img { display: block; width: 240px; height: 240px; image-rendering: pixelated; }
.join-url { font: 800 15px var(--display); word-break: break-all; max-width: 240px; }
.lobby-side { display: grid; gap: 16px; align-content: start; }
.lobby-side .names { justify-content: flex-start; max-width: none; }
.count { font: 700 20px var(--display); color: var(--muted); }
.count b { font-size: 56px; color: var(--sun); margin-right: 6px; font-variant-numeric: tabular-nums; }
.btn.danger { background: var(--bad); color: #fff; box-shadow: 0 5px 0 #8f1f23; }
.btn:disabled { opacity: .6; cursor: default; }
.pod { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin: 8px 0; }
.pod-col { display: grid; justify-items: center; gap: 6px; width: min(30%, 180px); text-align: center; }
.pod-name { font: 800 18px var(--display); word-break: break-word; }
.pod-pts { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.pod-bar { width: 100%; border-radius: 12px 12px 0 0; display: grid; place-items: center; font: 800 28px var(--display); color: #1a1200; }
.pod-col.p1 .pod-bar { height: 140px; background: var(--sun); }
.pod-col.p2 .pod-bar { height: 100px; background: #c9d4e3; }
.pod-col.p3 .pod-bar { height: 72px; background: #d08a4e; }
@media (max-width: 560px) { table.rank th:nth-child(4), table.rank td:nth-child(4) { display: none; } table.rank th, table.rank td { padding: 10px 8px; } table.rank td.pos { width: 36px; } }
@media (max-width: 700px) { .host-lobby { grid-template-columns: 1fr; justify-items: center; } .lobby-side .names { justify-content: center; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="sun" aria-hidden="true"></div>Placas Solares S.L.</div>
    <div class="stats" aria-live="polite">
      <div class="chip" id="whochip" hidden><span>Jugador</span><b id="who"></b></div>
      <div class="chip"><span>Puntos</span><b id="score">0</b></div>
      <div class="chip"><span>Racha</span><b id="streak">0</b></div>
    </div>
  </header>
  <main id="screen" class="screen"></main>
</div>
<script>
const SHAPES = [
  '<svg viewBox="0 0 24 24"><path d="M12 3 22 20H2z"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></svg>',
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/></svg>'
];
const TIME = 25;
const QUESTIONS = [
  { q: "¿Cuántas personas quieren crear la empresa de instalación de placas solares?", a: ["Cuatro", "Cinco", "Seis", "Ocho"], c: 2, why: "Son seis socios y quieren ser los únicos propietarios de la empresa." },
  { q: "¿De qué presupuesto total disponen los socios?", a: ["6.000 euros", "3.000 euros", "60.000 euros", "1.000 euros"], c: 0, why: "Entre todos cuentan con 6.000 euros para aportar al negocio." },
  { q: "¿Cuál es el capital mínimo legal de una sociedad limitada según el audio?", a: ["3.000 euros", "6.000 euros", "1 euro", "60.000 euros"], c: 2, why: "El capital mínimo legal de una SL es de 1 euro, así que los 6.000 € son suficientes." },
  { q: "Si los seis socios aportan lo mismo, ¿cuánto pone cada uno?", a: ["500 € y una décima parte", "2.000 € y un tercio", "6.000 € cada uno", "1.000 € y una sexta parte"], c: 3, why: "6.000 € entre 6 son 1.000 € por socio, y cada uno tendría una sexta parte de las participaciones." },
  { q: "¿Qué quiere hacer el socio que se va a vivir a Estados Unidos?", a: ["Trabajar a distancia", "Vender su parte", "Abrir una sede allí", "Duplicar su aportación"], c: 1, why: "Uno de los socios se irá a Estados Unidos y quiere vender sus participaciones." },
  { q: "¿Qué se puede incluir en los estatutos para resolver la venta de esas participaciones?", a: ["Un derecho de adquisición preferente", "Un aval personal", "Una ampliación de capital", "Un contrato indefinido"], c: 0, why: "Con el derecho de adquisición preferente, los demás socios tienen preferencia para comprar su parte." },
  { q: "En una SL, ¿en qué caso los socios SÍ pueden responder con sus bienes personales?", a: ["Siempre que haya deudas", "Cuando la empresa tiene pérdidas un año", "Cuando firman avales personales", "Nunca, en ningún caso"], c: 2, why: "Como regla general la responsabilidad se limita al capital aportado, pero hay excepciones, como los avales personales." },
  { q: "¿Qué permite constituir la sociedad limitada de forma telemática?", a: ["El Registro Civil y el NIE", "El sistema CIRCE y el DUE", "La Seguridad Social y el IAE", "Un correo al notario"], c: 1, why: "La SL se puede tramitar mediante CIRCE y el Documento Único Electrónico (DUE), con intervención del notario." },
  { q: "¿Qué requisito tiene la sociedad limitada laboral (SLL)?", a: ["Tener un único socio", "Un capital mínimo de 60.000 €", "Que se constituya solo en papel", "Que la mayoría del capital sea de socios trabajadores con contrato indefinido"], c: 3, why: "En la SLL la mayoría del capital debe pertenecer a socios que trabajen en la empresa con contrato indefinido." },
  { q: "¿Qué forma jurídica eligen finalmente para el proyecto?", a: ["Sociedad limitada laboral", "Sociedad anónima", "Sociedad limitada (SL)", "Empresario individual"], c: 2, why: "Eligen la SL porque cumple las cinco condiciones y ofrece una estructura flexible." }
];

const $ = (s, r = document) => r.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("es-ES");
const screen = $("#screen");
const API = "https://script.google.com/macros/s/AKfycbzHxyamfk4EZAmpag1muBAljUzKb0Caskcb8UxKFn7lEX9H63HTz-07deT-vQA8CwJt/exec";
const SITE = location.origin + location.pathname;
const MODE = /[?&]profe\b/.test(location.search) ? "host" : /[?&]tabla\b/.test(location.search) ? "tv" : "player";

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------------- Servidor ---------------- */
const S = { ok: false, err: false, phase: null, game: 0, players: [] };
let state = null;           // partida en curso de este jugador
let view = "";              // pantalla actual
let me = store.get("quiz-sl-me", null);
if (!me || !me.id) { me = { id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36), name: "", game: 0, done: false }; }
const saveMe = () => store.set("quiz-sl-me", me);
saveMe();

function rank(list) {
  return (list || []).map(r => ({ id: String(r.id), name: String(r.name), score: Number(r.score) || 0, hits: Number(r.hits) || 0, q: Number(r.q) || 0 }))
    .sort((a, b) => b.score - a.score || b.hits - a.hits || a.name.localeCompare(b.name));
}
async function post(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  return r.json();
}
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch(API + "?t=" + Date.now());
    const d = await r.json();
    S.phase = d.phase; S.game = Number(d.game); S.players = rank(d.players); S.ok = true; S.err = false;
  } catch (e) { S.err = true; }
  polling = false;
  onState();
}
function schedule() {
  const fast = MODE === "host" || view === "lobby" || view === "join" || view === "done" || MODE === "tv";
  setTimeout(async () => { if (!document.hidden) await poll(); schedule(); }, fast ? 2000 : 5000);
}

/* ---------------- Tabla ---------------- */
function boardHTML(opts = {}) {
  const rows = S.players;
  let body;
  if (!S.ok) body = `<div class="empty">${S.err ? "No se pudo conectar. Reintentando…" : "Cargando…"}</div>`;
  else if (!rows.length) body = `<div class="empty">Todavía no hay jugadores.</div>`;
  else body = `<div class="board-wrap"><table class="rank">
    <thead><tr><th>#</th><th>Nombre</th><th class="num">Progreso</th><th class="num">Aciertos</th><th class="num">Puntos</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="${i < 3 ? "p" + (i + 1) : ""} ${MODE === "player" && r.id === me.id ? "me" : ""}">
      <td class="pos">${i + 1}</td><td>${esc(r.name)}${MODE === "player" && r.id === me.id ? " (tú)" : ""}</td>
      <td class="num prog">${r.q >= 10 ? "Terminado" : r.q + "/10"}</td>
      <td class="num">${r.hits}</td><td class="num pts">${fmt(r.score)}</td></tr>`).join("")}</tbody></table></div>`;
  const playing = rows.filter(r => r.q < 10).length;
  const note = S.ok ? `${rows.length} jugador${rows.length === 1 ? "" : "es"}${S.phase === "playing" && playing ? " · " + playing + " jugando" : ""} · en directo` : "";
  return `<div class="board"><div class="board-head"><h3>${opts.title || "Clasificación"}</h3><span class="hint">${note}</span></div>${body}</div>`;
}
function podiumHTML() {
  const top = S.players.slice(0, 3);
  if (!top.length) return "";
  const order = [1, 0, 2].filter(i => top[i]);
  return `<div class="pod">${order.map(i => `<div class="pod-col p${i + 1}"><div class="pod-name">${esc(top[i].name)}</div><div class="pod-pts">${fmt(top[i].score)}</div><div class="pod-bar">${i + 1}º</div></div>`).join("")}</div>`;
}
function myRank() {
  const i = S.players.findIndex(r => r.id === me.id);
  return i < 0 ? null : { pos: i + 1, total: S.players.length };
}

/* ---------------- Jugador ---------------- */
function showJoin(msg) {
  view = "join";
  $("#whochip").hidden = true;
  const closed = S.ok && S.phase === "finished";
  screen.innerHTML = `
    <section class="intro pop">
      <h1>¿Qué sociedad para <em>seis socios</em> y 6.000 €?</h1>
      <p>Quiz en directo de 10 preguntas sobre el audio. Escribe tu nombre para entrar en la sala; la partida empieza cuando el profesor la inicie.</p>
      <div class="facts">
        <div class="chip"><span>Preguntas</span>10</div>
        <div class="chip"><span>Tiempo</span>${TIME} s</div>
        <div class="chip"><span>Máx.</span>1.000 pts + racha</div>
      </div>
      ${closed ? `<p class="status-line">La partida ha terminado. Espera a que el profesor abra una nueva.</p>` : `
      <form class="namebox" id="nameForm" novalidate>
        <label for="nameInput" style="position:absolute;left:-9999px">Tu nombre</label>
        <input id="nameInput" maxlength="24" autocomplete="off" placeholder="Escribe tu nombre" value="${esc(me.name || "")}">
        <button class="btn" type="submit" id="joinBtn">Entrar</button>
      </form>`}
      <p class="err" id="nameErr" role="alert">${msg ? esc(msg) : ""}</p>
      ${closed ? `<div id="boardSlot" style="text-align:left"></div>` : ""}
    </section>`;
  if (closed) { $("#boardSlot").innerHTML = boardHTML({ title: "Resultados" }); return; }
  $("#nameForm").onsubmit = async e => {
    e.preventDefault();
    const inp = $("#nameInput");
    const n = inp.value.trim().replace(/\s+/g, " ");
    if (n.length < 2) { $("#nameErr").textContent = "Escribe tu nombre (al menos 2 letras)."; inp.focus(); return; }
    const b = $("#joinBtn"); b.disabled = true; b.textContent = "Entrando…";
    if (!S.ok) await poll();
    try {
      const r = await post({ action: "join", id: me.id, name: n, game: S.game });
      if (!r.ok) {
        b.disabled = false; b.textContent = "Entrar";
        if (r.error === "partida") { S.game = Number(r.game); return $("#nameForm").requestSubmit(); }
        $("#nameErr").textContent = { "nombre-usado": "Ese nombre ya está en la sala. Prueba con otro.", terminada: "La partida ha terminado.", "nombre-corto": "Nombre demasiado corto." }[r.error] || "No se pudo entrar. Inténtalo otra vez.";
        return;
      }
      me.name = n; me.game = S.game; me.done = false; saveMe();
      $("#who").textContent = n; $("#whochip").hidden = false;
      await poll();
      if (S.phase === "playing") startQuiz(); else showLobby();
    } catch (err) {
      b.disabled = false; b.textContent = "Entrar";
      $("#nameErr").textContent = "Sin conexión. Inténtalo otra vez.";
    }
  };
}
function showLobby() {
  view = "lobby";
  screen.innerHTML = `
    <section class="lobby pop">
      <div class="pulse" aria-hidden="true"></div>
      <h1>¡Ya estás dentro, ${esc(me.name)}!</h1>
      <p class="status-line">Esperando a que el profesor inicie la partida…</p>
      <div id="lobbyList"></div>
    </section>`;
  renderLobbyList();
}
function renderLobbyList() {
  const el = $("#lobbyList"); if (!el) return;
  const ps = S.players;
  el.innerHTML = `<p class="hint">${ps.length} jugador${ps.length === 1 ? "" : "es"} en la sala</p>
    <div class="names">${ps.map(p => `<span class="name-chip ${p.id === me.id ? "mine" : ""}">${esc(p.name)}</span>`).join("")}</div>`;
}

function startQuiz() {
  state = { i: 0, score: 0, streak: 0, best: 0, log: [], timer: null, locked: false };
  $("#score").textContent = 0; $("#streak").textContent = 0;
  view = "quiz";
  screen.innerHTML = `<section class="intro pop"><h1 class="go">¡Empieza!</h1></section>`;
  setTimeout(ask, 1200);
}
function ask() {
  const Q = QUESTIONS[state.i];
  state.locked = false; state.t0 = performance.now();
  screen.innerHTML = `
    <div class="qhead"><span>Pregunta ${state.i + 1} de ${QUESTIONS.length}</span><span>${esc(me.name)}</span></div>
    <div class="question pop">${Q.q}</div>
    <div class="mid">
      <div class="timer" id="timer" style="--p:1"><b id="tnum">${TIME}</b></div>
      <div class="bar" aria-hidden="true"><i style="width:${(state.i / QUESTIONS.length) * 100}%"></i></div>
    </div>
    <div class="answers" id="answers">
      ${Q.a.map((t, k) => `<button class="ans" data-k="${k}"><span class="shape" aria-hidden="true">${SHAPES[k]}</span><span>${t}</span><span class="key" aria-hidden="true">${k + 1}</span></button>`).join("")}
    </div>
    <div id="fb"></div>`;
  screen.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.k));
  clearInterval(state.timer);
  state.timer = setInterval(tick, 100);
}
function tick() {
  const left = Math.max(0, TIME - (performance.now() - state.t0) / 1000);
  const t = $("#timer"); if (!t) return;
  t.style.setProperty("--p", left / TIME);
  $("#tnum").textContent = Math.ceil(left);
  if (left <= 0) answer(-1);
}
function sendProgress() {
  const rec = { action: "progress", id: me.id, game: me.game, score: state.score, hits: state.log.filter(l => l.ok).length, q: state.log.length };
  const p = S.players.find(r => r.id === me.id);
  if (p) { p.score = rec.score; p.hits = rec.hits; p.q = rec.q; S.players = rank(S.players); }
  return post(rec).then(r => { if (r && r.error === "partida") onState(); return r; }).catch(() => null);
}
function answer(k) {
  if (state.locked) return;
  state.locked = true;
  clearInterval(state.timer);
  const Q = QUESTIONS[state.i];
  const elapsed = Math.min(TIME, (performance.now() - state.t0) / 1000);
  const ok = k === Q.c;
  let gain = 0;
  if (ok) {
    state.streak++;
    gain = Math.round(1000 * (1 - (elapsed / TIME) / 2));
    if (state.streak >= 2) gain += Math.min(500, (state.streak - 1) * 100);
    state.score += gain;
  } else state.streak = 0;
  state.best = Math.max(state.best, state.streak);
  state.log.push({ k, ok, gain });
  $("#score").textContent = fmt(state.score);
  $("#streak").textContent = state.streak;
  screen.querySelectorAll(".ans").forEach((b, idx) => {
    b.disabled = true;
    if (idx === Q.c) { b.classList.add("right"); b.querySelector(".key")?.remove(); b.insertAdjacentHTML("beforeend", '<span class="mark" aria-label="correcta">✓</span>'); }
    else b.classList.add("dim");
    if (idx === k && !ok) { b.classList.remove("dim"); b.style.opacity = .6; b.querySelector(".key")?.remove(); b.insertAdjacentHTML("beforeend", '<span class="mark" aria-label="tu respuesta">✗</span>'); }
  });
  const last = state.i === QUESTIONS.length - 1;
  sendProgress().then(() => poll()).then(() => { const rk = myRank(), el = $("#rankLine"); if (rk && el) el.textContent = `Vas ${rk.pos}º de ${rk.total}`; });
  const verdict = ok ? (state.streak >= 3 ? `¡Correcto! Racha de ${state.streak}` : "¡Correcto!") : (k === -1 ? "Se acabó el tiempo" : "Incorrecto");
  $("#fb").innerHTML = `
    <div class="feedback ${ok ? "ok" : "bad"} pop" role="status">
      <div class="verdict">${ok ? "✓" : "✗"}</div>
      <div class="fbtxt"><div class="verdict">${verdict}</div><p>${Q.why}</p></div>
      <div class="gain">+${gain}</div>
    </div>
    <div class="next-row" style="margin-top:12px;justify-content:space-between;align-items:center"><span class="rankline" id="rankLine">Calculando tu puesto…</span><button class="btn" id="next">${last ? "Ver resultados" : "Siguiente"}</button></div>`;
  const n = $("#next");
  n.onclick = () => { state.i++; last ? finish() : ask(); };
  n.focus();
}
function finish() {
  me.done = true; saveMe();
  view = "done";
  const hits = state.log.filter(l => l.ok).length;
  const msg = hits === 10 ? "Pleno. Listos para ir al notario."
    : hits >= 8 ? "Muy bien. Dominas la sociedad limitada."
    : hits >= 5 ? "Bien. Repasa los detalles que fallaste."
    : "Vuelve a escuchar el audio.";
  screen.innerHTML = `
    <section class="end pop">
      <div class="podium">
        <div class="whoami">${esc(me.name)}</div>
        <div class="big">${fmt(state.score)}</div>
        <h2>${hits} de ${QUESTIONS.length} aciertos</h2>
        <p>${msg} Mejor racha: ${state.best}.</p>
        <p class="rankline" id="finalRank"></p>
      </div>
      <div id="boardSlot"></div>
      <div class="review">
        <h3>Repaso</h3>
        ${QUESTIONS.map((Q, i) => {
          const l = state.log[i];
          return `<div class="ritem"><div class="n">${i + 1}</div><div class="t"><b>${Q.q}</b><small>Respuesta: ${Q.a[Q.c]}${!l.ok ? (l.k === -1 ? " · sin responder" : " · tú: " + Q.a[l.k]) : ""}</small></div><div class="s ${l.ok ? "ok" : "bad"}">${l.ok ? "+" + l.gain : "✗"}</div></div>`;
        }).join("")}
      </div>
    </section>`;
  renderDone();
}
function renderDone() {
  const rk = myRank();
  const el = $("#finalRank");
  if (el) el.textContent = rk ? (S.phase === "finished" ? `Puesto final: ${rk.pos}º de ${rk.total}` : `Vas ${rk.pos}º de ${rk.total} · la tabla sigue cambiando mientras juegan los demás`) : "";
  const b = $("#boardSlot");
  if (b) b.innerHTML = (S.phase === "finished" ? `<h2 class="center">🏆 Partida terminada</h2>` + podiumHTML() : "") + boardHTML();
}

function onState() {
  if (MODE === "host") return renderHost();
  if (MODE === "tv") return renderTV();
  if (!S.ok) return;
  // el profesor ha borrado la tabla: nueva partida
  if (me.game && me.game !== S.game) {
    me.game = 0; me.done = false; saveMe();
    if (state) clearInterval(state.timer);
    state = null;
    return showJoin("El profesor ha abierto una partida nueva. Vuelve a entrar con tu nombre.");
  }
  const joined = me.game === S.game && S.players.some(p => p.id === me.id);
  if (view === "join" && S.phase === "finished" && !$("#boardSlot")) return showJoin();
  if (view === "join" && S.phase !== "finished" && $("#boardSlot")) return showJoin();
  if (view === "lobby") {
    if (S.phase === "playing") return startQuiz();
    if (S.phase === "finished") return showJoin();
    return renderLobbyList();
  }
  if (view === "done") return renderDone();
  if (view === "boot") {
    if (joined && me.done) { view = "done-lite"; return showResultsOnly(); }
    if (joined && S.phase === "lobby") { $("#who").textContent = me.name; $("#whochip").hidden = false; return showLobby(); }
    if (joined && S.phase === "playing") { $("#who").textContent = me.name; $("#whochip").hidden = false; return startQuiz(); }
    return showJoin();
  }
  if (view === "done-lite") return showResultsOnly();
}
function showResultsOnly() {
  screen.innerHTML = `<section class="end pop"><div class="podium"><div class="whoami">${esc(me.name)}</div><h2>Ya has terminado tu partida</h2><p class="rankline" id="finalRank"></p></div><div id="boardSlot"></div></section>`;
  renderDone();
}

/* ---------------- Proyector (solo lectura) ---------------- */
function renderTV() {
  document.body.classList.add("tv");
  screen.innerHTML = `<section class="end"><div class="podium"><h2>${S.phase === "lobby" ? "Sala de espera" : S.phase === "finished" ? "🏆 Resultados" : "Clasificación en directo"}</h2></div>${S.phase === "finished" ? podiumHTML() : ""}${boardHTML()}</section>`;
}

/* ---------------- Profesor ---------------- */
let hostKey = store.get("quiz-sl-key", "");
let hostOk = false, hostBusy = false, armed = "";
async function hostLogin(msg) {
  document.body.classList.add("tv");
  $("#whochip").hidden = true;
  screen.innerHTML = `
    <section class="intro pop">
      <h1>Panel del <em>profesor</em></h1>
      <p>Escribe la clave del profesor para controlar la partida.</p>
      <form class="namebox" id="keyForm" novalidate>
        <input id="keyInput" type="password" autocomplete="current-password" placeholder="Clave del profesor" value="">
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="err" id="keyErr" role="alert">${msg || ""}</p>
    </section>`;
  $("#keyForm").onsubmit = async e => {
    e.preventDefault();
    const k = $("#keyInput").value.trim();
    if (!k) return;
    $("#keyErr").textContent = "Comprobando…";
    const ok = await checkKey(k);
    if (!ok) { $("#keyErr").textContent = "Clave incorrecta."; return; }
    hostKey = k; store.set("quiz-sl-key", k); hostOk = true; renderHost();
  };
}
async function checkKey(k) {
  try { const r = await post({ action: "check", key: k }); return !!r.ok; } catch (e) { return false; }
}
async function hostAction(act) {
  if (hostBusy) return;
  hostBusy = true; renderHost();
  try {
    const r = await post({ action: act, key: hostKey });
    if (!r.ok && r.error === "clave") { hostOk = false; store.set("quiz-sl-key", ""); hostBusy = false; return hostLogin("La clave ya no es válida."); }
    if (r.ok) { S.phase = r.phase; S.game = r.game; if (act === "reset") S.players = []; }
  } catch (e) { alert("No se pudo conectar. Inténtalo otra vez."); }
  hostBusy = false; armed = "";
  await poll();
}
function renderHost() {
  if (!hostOk) return;
  const ph = S.phase;
  const n = S.players.length;
  const done = S.players.filter(p => p.q >= 10).length;
  const btn = (id, label, cls = "") => `<button class="btn ${cls}" id="${id}" ${hostBusy ? "disabled" : ""}>${hostBusy ? "Un momento…" : label}</button>`;
  let main = "";
  if (!S.ok) main = `<div class="empty">Conectando…</div>`;
  else if (ph === "lobby") {
    main = `
      <div class="host-lobby">
        <div class="join-card">
          <img src="qr.png" alt="Código QR para unirse" width="240" height="240">
          <div class="join-url">${esc(SITE.replace(/^https?:\/\//, ""))}</div>
        </div>
        <div class="lobby-side">
          <div class="count"><b>${n}</b> jugador${n === 1 ? "" : "es"} en la sala</div>
          <div class="names big">${S.players.map(p => `<span class="name-chip">${esc(p.name)}</span>`).join("") || `<span class="hint">Esperando a que entren los jugadores…</span>`}</div>
        </div>
      </div>
      <div class="actions">${btn("startBtn", "▶ Iniciar partida")}</div>`;
  } else if (ph === "playing") {
    main = `
      <p class="status-line center">Partida en curso · ${done} de ${n} han terminado</p>
      ${boardHTML()}
      <div class="actions">${btn("finishBtn", armed === "finish" ? "Pulsa otra vez para finalizar" : "■ Finalizar partida", "ghost")}</div>`;
  } else {
    main = `
      <h2 class="center">🏆 Partida terminada</h2>
      ${podiumHTML()}
      ${boardHTML({ title: "Resultados" })}
      <div class="actions">${btn("resetBtn", armed === "reset" ? "Pulsa otra vez: se borrarán todos los resultados" : "Borrar tabla y nueva partida", "danger")}</div>`;
  }
  screen.innerHTML = `
    <section class="end">
      <div class="host-head"><h1>${ph === "lobby" ? "Sala de espera" : ph === "playing" ? "En directo" : "Resultados"}</h1>
      <span class="hint">Panel del profesor · Partida ${S.game || ""}</span></div>
      ${main}
      ${ph !== "finished" && S.ok ? `<div style="text-align:center"><button class="linkbtn" id="resetLink">${armed === "reset" ? "Pulsa otra vez para borrar la tabla y vaciar la sala" : "Borrar tabla y empezar de cero"}</button></div>` : ""}
    </section>`;
  const on = (id, f) => { const b = $("#" + id); if (b) b.onclick = f; };
  on("startBtn", () => hostAction("start"));
  on("finishBtn", () => { if (armed !== "finish") { armed = "finish"; renderHost(); } else hostAction("finish"); });
  const reset = () => { if (armed !== "reset") { armed = "reset"; renderHost(); } else hostAction("reset"); };
  on("resetBtn", reset); on("resetLink", reset);
}

document.addEventListener("keydown", e => {
  if (view !== "quiz" || !state || state.locked || !$("#answers") || e.target.tagName === "INPUT") return;
  const k = ["1", "2", "3", "4"].indexOf(e.key);
  if (k >= 0) answer(k);
});

/* ---------------- Arranque ---------------- */
(async function boot() {
  if (MODE === "host") {
    if (hostKey && await checkKey(hostKey)) hostOk = true;
    if (!hostOk) hostLogin();
  } else if (MODE === "player") {
    view = "boot";
    screen.innerHTML = `<section class="intro"><p class="status-line">Conectando con la partida…</p></section>`;
  }
  await poll();
  if (MODE === "player" && view === "boot" && !S.ok) showJoin("No se pudo conectar. Revisa la conexión y recarga la página.");
  schedule();
})();
</script>
</body>
</html>
